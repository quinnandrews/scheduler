
spring.testcontainers.beans.startup=parallel

example.data.migration.user.password=test

spring.local.postgresql.container.image=postgres:15
spring.local.postgresql.container.port=5432
spring.local.postgresql.database.username=${example.data.migration.user}
spring.local.postgresql.database.password=${example.data.migration.user.password}
spring.local.postgresql.database.application.username=${example.data.application.user}
spring.local.postgresql.database.application.password=${example.data.application.user}
spring.local.postgresql.database.init.script=data/init/postgreSQLContainerInit.sql

spring.flyway.password=${example.data.migration.user.password}

